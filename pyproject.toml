[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garden-ecosystem"
version = "0.1.0"
description = "Auditable, offline-first adapters for BloomBloomGarden"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "garden-ecosystem contributors"}]

[tool.setuptools.packages.find]
where = ["src"]
